<svg xmlns="http://www.w3.org/2000/svg" width="860" height="424" viewBox="0 0 860 424" role="img" aria-label="Decode gain of each adopted step" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
