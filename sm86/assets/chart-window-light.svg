<svg xmlns="http://www.w3.org/2000/svg" width="860" height="210" viewBox="0 0 860 210" role="img" aria-label="Where one decode window goes" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
